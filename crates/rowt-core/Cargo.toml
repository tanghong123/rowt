[package]
name = "rowt-core"
version = "0.1.0"
edition = "2021"
description = "The pure parts of rowt — configuration render and lane classification"
license = "MIT"

[dependencies]
# preserve_order: `net-detect` emits a dict whose KEY ORDER is Python's
# insertion order, and the gate compares bytes. serde_json's default Map sorts,
# which would reorder every object it renders.
serde_json = { version = "1", features = ["preserve_order"] }
ipnet = "2"
# V2Box keeps its share links in a Core Data SQLite file, and the Python's
# behaviour forks on the STORAGE CLASS of each column: a BLOB `ZURL` reaches
# `bytes.startswith(str)` and dies, an INTEGER one dies in `.strip()`, and only
# TEXT gets imported. Nothing short of a real driver reports those apart, so
# this is a semantics dependency rather than a convenience one. `bundled` so
# Phase 5 on Linux does not also need libsqlite3-dev.
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "rowt-render"
path = "src/bin/rowt-render.rs"

[[bin]]
name = "rowt-explain"
path = "src/bin/rowt-explain.rs"

[[bin]]
name = "rowt-lanes"
path = "src/bin/rowt-lanes.rs"

[[bin]]
name = "rowt-reconcile"
path = "src/bin/rowt-reconcile.rs"

[[bin]]
name = "rowt-watch-tick"
path = "src/bin/rowt-watch-tick.rs"

[[bin]]
name = "rowt-vless"
path = "src/bin/rowt-vless.rs"

[[bin]]
name = "rowt-import-merge"
path = "src/bin/rowt-import-merge.rs"

[[bin]]
name = "rowt-foreign-import"
path = "src/bin/rowt-foreign-import.rs"
